function toast(msg){$('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;el.setAttribute('role','status');document.body.append(el);$('#status').textContent=msg;setTimeout(()=>el.remove(),4500)}
function badge(r){return `<span class="badge ${r.status==='done'?'done':''}">${r.status==='done'?'已完成':'待處理'}</span><span class="badge type">${r.type==='multi'?'多組圖文':'一般提報'}</span>`}
function shell(){const accessible=state.reports.filter(allowed),pending=accessible.filter(r=>r.status==='pending').length,done=accessible.filter(r=>r.status==='done').length;$('#app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">♧</div><div>工作提報小站<small>讓 協 作 輕 一 點</small></div></div><nav class="nav" aria-label="主要導覽">${[['inbox','▤','提報工作台'],['create','＋','建立提報'],['archive','✓','已完成'],...(manage()?[['admin','⚙','管理設定']]:[])].map(([v,i,l])=>`<button data-nav="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}><span>${i}</span>${l}${v==='inbox'?`<b class="count">${pending}</b>`:''}</button>`).join('')}</nav><div class="sidefoot"><div class="person"><span class="avatar">${esc(me().name.slice(-2))}</span><p>${esc(me().name)}<small>${esc(me().role)} · 示範角色</small></p></div><small>切換角色，體驗不同流程</small>${roleSelect()}<small>● 資料保存在此瀏覽器</small></div></aside><main class="main" id="content"><div class="topbar"><span class="crumb">我的工作空間 ／ ${view==='create'?'建立提報':view==='admin'?'管理設定':'提報總覽'}</span><div class="mobile-role">${roleSelect()}</div><div class="toptools"><span class="pill">課程作業 · 互動示範</span><button class="ghost small" id="help">操作說明</button><button class="ghost small" id="reset">重設示範</button></div></div>${view==='inbox'||view==='archive'?`<section class="intro"><div><div class="eyebrow">把想法整理好，讓每一次協作更清楚</div><h1>${view==='archive'?'每一個完成，都有跡可循。':'讓工作，有條理地前進。'}</h1><p>${view==='archive'?'回顧已完成的提報與討論，接住下一個好想法。':'提報、討論、確認。在這裡，把事情一起做好。'}</p></div><button class="primary" data-nav="create">＋ 建立提報</button></section><div class="stats"><div class="stat"><span class="symbol">◷</span><div><b>${pending.toString().padStart(2,'0')}</b><small>待處理提報</small></div></div><div class="stat"><span class="symbol">✓</span><div><b>${done.toString().padStart(2,'0')}</b><small>已完成提報</small></div></div><div class="stat"><span class="symbol">▤</span><div><b>${accessible.length.toString().padStart(2,'0')}</b><small>可查看提報</small></div></div></div><div class="workspace"><section class="panel"><div class="listhead"><h3>提報清單</h3><label class="sr-only" for="search">搜尋提報</label><input id="search" class="search" placeholder="搜尋標題、重點或留言…" value="${esc(query)}"><div class="filters">${(view==='archive'?[['done','已完成']]:[['pending','待處理'],['all','全部'],['done','已完成']]).map(([v,l])=>`<button data-filter="${v}" class="${filter===v?'active':''}">${l}</button>`).join('')}</div></div><div class="reportlist" id="reportlist"></div></section><article class="panel detail" id="detail"></article></div>`:`<div id="page"></div>`}<footer class="appfooter">工作提報小站 · 課程示範版　｜　虛構人物與資料，僅儲存在此瀏覽器</footer></main></div>`;bindShell();if(view==='create')renderForm();else if(view==='admin')renderAdmin();else renderList()}
function roleSelect(){return `<select class="role-select" aria-label="切換示範角色">${state.users.map(u=>`<option value="${u.id}" ${u.id===role?'selected':''}>${esc(u.name)} · ${esc(u.role)}</option>`).join('')}</select>`}
function bindShell(){$$('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));$$('.role-select').forEach(s=>s.onchange=async()=>{if(!await leavePage())return shell();role=s.value;view='inbox';filter='pending';query='';selected=null;decisionDraft={};shell()});$('#help').onclick=help;$('#reset').onclick=reset;$('[data-filter]');$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;shell()});if($('#search'))$('#search').oninput=e=>{query=e.target.value;renderList()}}
async function leavePage(){if(uploadBusy){toast('檔案正在處理，請稍候');return false}if(view==='create'&&formData)return await saveDraft(true);stopVoice();return true}
async function navigate(v){if(!await leavePage())return;view=v;query='';filter=v==='archive'?'done':'pending';edit=null;formData=null;shell()}
function filtered(){return state.reports.filter(allowed).filter(r=>(filter==='all'||r.status===filter)&&(view!=='archive'||r.status==='done')&&[r.title,r.detail,...r.points,...r.comments.map(c=>c.body)].join(' ').toLowerCase().includes(query.toLowerCase()))}
function renderList(){const list=filtered();if(!list.some(r=>r.id===selected))selected=list[0]?.id;$('#reportlist').innerHTML=list.map(r=>`<button class="reportcard ${selected===r.id?'selected':''}" data-report="${r.id}">${badge(r)}<h3>${esc(r.title)}</h3><p>${esc(r.points[0]||r.detail)}</p><footer><span>${esc(uname(r.author))}</span><time>${date(r.created)}</time></footer></button>`).join('')||'<div class="empty"><span>⌕</span>沒有符合的提報<br><small>試試其他關鍵字或篩選條件</small></div>';$$('[data-report]').forEach(b=>b.onclick=()=>{stopVoice();selected=b.dataset.report;renderList();if(innerWidth<=640)$('#detail').scrollIntoView({behavior:'smooth',block:'start'})});renderDetail()}
function current(){return state.reports.find(r=>r.id===selected&&allowed(r))}
function imageHTML(f){return `<button class="imagebutton" data-img="${f.id}" aria-label="放大 ${esc(f.name)}"><img src="${esc(f.data)}" alt="${esc(f.name)}" loading="lazy"><span>${esc(f.name)} · 點擊放大</span></button>`}
function filesHTML(files){return `<div class="images">${files.filter(f=>f.type.startsWith('image/')).map(imageHTML).join('')}</div><div class="attachments">${files.filter(f=>!f.type.startsWith('image/')).map(f=>`<a class="attachment" download="${esc(f.name)}" href="${esc(f.data)}">↧ ${esc(f.name)} · ${size(f.size)}</a>`).join('')}</div>`}
function answers(r){return manage()?(decisionDraft[role+':'+r.id]??r.answers):r.answers}
function optionHTML(opts,key,r){return `<div class="options">${opts.map((o,i)=>`<button class="option ${answers(r)[key]===o?'chosen':''}" data-answer="${key}" data-value="${i}" ${!manage()?'disabled':''} aria-pressed="${answers(r)[key]===o}"><span class="letter">${answers(r)[key]===o?'✓':String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join('')}</div>`}
function renderDetail(){const r=current(),el=$('#detail');if(!r){el.innerHTML='<div class="empty"><span>♧</span>這裡還沒有提報<br><small>建立一篇，開始整理你的想法。</small></div>';return}const a=answers(r),changed=JSON.stringify(a)!==JSON.stringify(r.answers),complete=r.type==='multi'?r.groups.every(g=>a[g.id]):!!a.main,canEdit=r.author===role&&r.status==='pending'&&!Object.keys(r.answers).length;el.innerHTML=`<div class="detailheader"><div>${badge(r)}<h2>${esc(r.title)}</h2></div>${canEdit?'<button id="edit-report" class="small">修改提報</button>':''}</div><div class="meta"><span>提報人 ${esc(uname(r.author))}</span><time>${date(r.created)}</time><span>${r.groups.length?r.groups.length+' 組圖文':r.files.length+' 個附件'}</span></div>${r.author!==role&&!manage()?'<div class="notice">此內容已分享給你 · '+(commentable(r)?'可閱讀及留言':'僅可閱讀')+'</div>':''}<div class="question"><small>這篇要決定什麼？</small><strong>${esc(r.question)}</strong></div><p class="prose muted">${esc(r.detail)}</p>${r.points.length?`<ul class="points">${r.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}<section class="section"><h3>${r.type==='multi'?'圖文審核':'素材與回答'}</h3>${r.type==='multi'?`<div class="progress"><span>已選 ${r.groups.filter(g=>a[g.id]).length} / ${r.groups.length} 組</span><div class="track"><i style="width:${r.groups.filter(g=>a[g.id]).length/r.groups.length*100}%"></i></div></div><div class="quicknav">${r.groups.map((g,i)=>`<button class="small" data-jump="${g.id}">${a[g.id]?'✓ ':''}${String(i+1).padStart(2,'0')}</button>`).join('')}<button class="small ghost" id="next-unanswered">下一個未回答 ↓</button></div>${r.groups.map((g,i)=>`<section class="group" id="group-${g.id}"><div class="grouphead"><h4>${String(i+1).padStart(2,'0')}　${esc(g.label)}</h4><button class="small ghost" data-collapse="${g.id}">收合</button></div><div id="body-${g.id}"><div class="images">${g.images.map(imageHTML).join('')}</div>${optionHTML(g.options,g.id,r)}</div></section>`).join('')}`:`${r.files.length?filesHTML(r.files):'<p class="muted"><small>這篇沒有附加檔案。</small></p>'}${optionHTML(r.options,'main',r)}`}${r.type==='multi'&&r.files.length?filesHTML(r.files):''}${manage()?`<div class="notice">${changed?'選擇已暫存，尚未正式送出。':r.status==='done'?'以下為已正式送出的結果。':'選擇答案後，按下確認送出才會完成審核。'}</div><div class="row between"><button id="share" class="small">分享與權限</button><button id="decision" class="primary" ${!complete||(!changed&&r.status==='done')?'disabled':''}>${r.status==='done'?'確認修改決策':'檢查答案並送出'}</button></div>`:r.status==='done'?'<div class="notice">審核已完成，可以查看正式結果；如需修改請補件。</div>':''}</section><section class="section"><div class="row between"><h3>討論與留言 <small>${r.comments.length}</small></h3>${r.author===role?'<button class="small" id="supplement">＋ 補件並重新送審</button>':''}</div>${r.comments.map(c=>`<div class="comment"><span class="avatar">${esc(uname(c.author).slice(-2))}</span><div class="commentcontent"><div class="row between"><strong style="font-size:13px">${esc(uname(c.author))}</strong><small>${date(c.at)}${c.history.length?' · 已編輯':''}</small></div><p>${esc(c.body)}</p>${c.audio?`<audio controls preload="metadata" src="${esc(c.audio)}"></audio>`:''}${c.author===role&&!c.audio?`<button class="small ghost" data-editcomment="${c.id}">編輯</button>`:''}${c.history.length?`<details><summary>查看修改紀錄</summary><ul class="history">${c.history.map(h=>`<li>${date(h.at)}：${esc(h.before)} → ${esc(h.after)}</li>`).join('')}</ul></details>`:''}</div></div>`).join('')||'<p class="muted"><small>還沒有留言，留下第一個想法吧。</small></p>'}${commentable(r)?`<div class="commentform"><label class="sr-only" for="comment">留言內容</label><textarea id="comment" maxlength="3000" placeholder="補充想法，讓討論更清楚…"></textarea><div class="row between"><button class="small" id="voice">♩ 錄製語音</button><button class="primary small" id="send-comment">送出留言</button></div><div id="voice-area" aria-live="polite"></div></div>`:'<p class="notice">目前僅可閱讀；審核者開放留言後即可參與討論。</p>'}</section><details class="section"><summary>查看提報與審核紀錄（${r.history.length}）</summary><ul class="history">${r.history.slice().reverse().map(h=>`<li><strong>${esc(uname(h.actor))}</strong> · ${date(h.at)}<br>${esc(h.text)}</li>`).join('')||'<li>尚無修改與決策紀錄。</li>'}</ul></details>`;$$('[data-answer]').forEach(b=>b.onclick=()=>{const key=b.dataset.answer,opts=key==='main'?r.options:r.groups.find(g=>g.id===key).options;decisionDraft[role+':'+r.id]={...a,[key]:opts[+b.dataset.value]};stopVoice();renderDetail()});$$('[data-jump]').forEach(b=>b.onclick=()=>$('#group-'+b.dataset.jump).scrollIntoView({behavior:'smooth',block:'center'}));$('#next-unanswered')?.addEventListener('click',()=>{const g=r.groups.find(g=>!a[g.id]);if(g)$('#group-'+g.id).scrollIntoView({behavior:'smooth',block:'center'});else toast('所有區塊都已選擇')});$$('[data-collapse]').forEach(b=>b.onclick=()=>{const body=$('#body-'+b.dataset.collapse);body.hidden=!body.hidden;b.textContent=body.hidden?'展開':'收合'});bindImages(r);$('#decision')?.addEventListener('click',()=>confirmDecision(r));$('#share')?.addEventListener('click',()=>shareModal(r));$('#edit-report')?.addEventListener('click',()=>{edit=r.id;formData=null;view='create';shell()});$('#supplement')?.addEventListener('click',()=>supplementModal(r));$('#send-comment')?.addEventListener('click',async()=>{const body=$('#comment').value.trim();if(!body)return toast('請先輸入留言');if(await commit(s=>s.reports.find(x=>x.id===r.id).comments.push({id:uid(),author:role,body,at:Date.now(),history:[]}),'留言已送出'))renderDetail()});$$('[data-editcomment]').forEach(b=>b.onclick=()=>editComment(r,b.dataset.editcomment));$('#voice')?.addEventListener('click',startVoice)}
function allFiles(r){return [...r.files,...r.groups.flatMap(g=>g.images)]}
function bindImages(r){$$('[data-img]').forEach(b=>b.onclick=()=>{const f=allFiles(r).find(f=>f.id===b.dataset.img);showModal(`<h2>${esc(f.name)}</h2><img src="${esc(f.data)}" alt="${esc(f.name)}">`,'lightbox')})}
function showModal(html,cls=''){stopVoice();const d=$('#modal');if(d.open)d.close();d.className=cls;d.innerHTML='<button class="close ghost small" aria-label="關閉視窗">✕</button>'+html;$('.close',d).onclick=()=>d.close();d.showModal();return d}
function confirmDecision(r){const a=structuredClone(answers(r));const d=showModal(`<h2>確認這次的審核結果</h2><p class="muted">送出後將標示為已完成，並保留決策紀錄。</p>${r.type==='multi'?r.groups.map(g=>`<div class="question"><small>${esc(g.label)}</small><strong>${esc(a[g.id])}</strong></div>`).join(''):`<div class="question">${esc(a.main)}</div>`}<div class="row"><button class="primary" id="confirm-decision">確認送出</button><button id="back">返回修改</button></div>`);$('#back').onclick=()=>d.close();$('#confirm-decision').onclick=async e=>{e.target.disabled=true;if(await commit(s=>{const x=s.reports.find(x=>x.id===r.id);for(const [k,v] of Object.entries(a)){if(x.answers[k]!==v)x.history.push({at:Date.now(),actor:role,text:(k==='main'?'整體回答':x.groups.find(g=>g.id===k).label)+'：'+(x.answers[k]||'未選擇')+' → '+v})}x.answers=a;x.status='done';x.history.push({at:Date.now(),actor:role,text:'確認送出，完成審核'})},'審核已完成，辛苦了！')){delete decisionDraft[role+':'+r.id];d.close();shell()}else e.target.disabled=false}}
function shareModal(r){const people=state.users.filter(u=>u.role==='員工'&&u.id!==r.author);const d=showModal(`<h2>分享給同事</h2><p class="muted">設定其他提報者可以閱讀或留言的範圍。</p>${people.map(u=>`<label class="field"><b>${esc(u.name)}</b><select data-share="${u.id}"><option value="none">不分享</option><option value="view" ${r.shares.find(x=>x.user===u.id)?.permission==='view'?'selected':''}>僅可閱讀</option><option value="comment" ${r.shares.find(x=>x.user===u.id)?.permission==='comment'?'selected':''}>可閱讀及留言</option></select></label>`).join('')||'<p>目前沒有其他員工可分享。</p>'}<button id="save-share" class="primary">儲存權限</button>`);$('#save-share').onclick=async()=>{const shares=$$('[data-share]').filter(s=>s.value!=='none').map(s=>({user:s.dataset.share,permission:s.value}));if(await commit(s=>{const x=s.reports.find(x=>x.id===r.id);x.shares=shares;x.history.push({at:Date.now(),actor:role,text:'更新分享權限'})},'分享權限已更新')){d.close();renderDetail()}}}
function editComment(r,id){const c=r.comments.find(c=>c.id===id);const d=showModal(`<h2>編輯留言</h2><label class="field"><b>留言內容</b><textarea id="edit-comment-body" maxlength="3000">${esc(c.body)}</textarea></label><button class="primary" id="save-comment">儲存修改</button>`);$('#save-comment').onclick=async()=>{const body=$('#edit-comment-body').value.trim();if(!body)return toast('留言不可空白');if(body===c.body)return d.close();if(await commit(s=>{const x=s.reports.find(x=>x.id===r.id).comments.find(x=>x.id===id);x.history.push({at:Date.now(),before:x.body,after:body});x.body=body},'留言已更新，修改紀錄已保留')){d.close();renderDetail()}}}
async function readFiles(list,imagesOnly=false){const result=[];for(const f of [...list]){if(f.size>5*1024*1024)throw Error(f.name+' 超過單檔 5 MB 限制');if(!f.size)throw Error(f.name+' 是空白檔案');const ext=f.name.split('.').pop().toLowerCase();const types={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',pdf:'application/pdf',csv:'text/csv',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',xls:'application/vnd.ms-excel'};if(!types[ext]||(imagesOnly&&!types[ext].startsWith('image/')))throw Error('不支援 '+f.name+' 的格式');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('無法讀取檔案'));reader.readAsDataURL(f)});result.push({id:uid(),name:f.name,size:f.size,type:types[ext],data})}return result}
function checkTotal(add){if(JSON.stringify(state).length+JSON.stringify(add).length>32*1024*1024)throw Error('此示範版最多保存約 24 MB 資料，請縮小圖片或重設示範後再試')}
function supplementModal(r){let files=[];const d=showModal(`<h2>補件並重新送審</h2><p class="muted">保留原提報與決策，新增資料後回到待處理。</p>${r.type==='multi'?`<label class="field"><b>補件區塊</b><select id="supp-group"><option value="">整份提報</option>${r.groups.map(g=>`<option value="${g.id}">${esc(g.label)}</option>`).join('')}</select></label>`:''}<label class="field"><b>補充說明</b><textarea id="supp-text" maxlength="5000" placeholder="這次補充或修改了什麼？"></textarea></label><label class="upload">加入圖片或附件（單檔 5 MB）<input id="supp-files" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.pdf,.csv,.xls,.xlsx"></label><div id="supp-filelist"></div><p id="supp-error" role="status"></p><button id="send-supp" class="primary">送出補件</button>`);$('#supp-files').onchange=async e=>{uploadBusy=true;$('#send-supp').disabled=true;try{const added=await readFiles(e.target.files);checkTotal(added);files.push(...added);$('#supp-filelist').textContent=files.map(f=>f.name).join('、')}catch(err){$('#supp-error').textContent=err.message}finally{uploadBusy=false;$('#send-supp').disabled=false;e.target.value=''}};$('#send-supp').onclick=async()=>{const text=$('#supp-text').value.trim(),group=$('#supp-group')?.value;if(!text&&!files.length)return toast('請填寫補充說明或加入附件');const label=r.groups.find(g=>g.id===group)?.label;if(await commit(s=>{const x=s.reports.find(x=>x.id===r.id);x.files.push(...files);x.comments.push({id:uid(),author:role,body:'補件'+(label?'（'+label+'）':'')+'：'+(text||'新增附件'),at:Date.now(),history:[]});x.status='pending';x.history.push({at:Date.now(),actor:role,text:'補件並重新送審'+(label?'：'+label:'')})},'補件已送出，狀態回到待處理')){d.close();filter='pending';view='inbox';shell()}}}
function blank(){return {title:'',type:'normal',points:'',detail:'',question:'',options:['',''],files:[],groups:[{id:uid(),label:'第一組',images:[],options:['','']}],checked:false}}
let draftTimer;
async function saveDraft(quiet=false){clearTimeout(draftTimer);if(!formData||edit)return true;const draft=structuredClone(formData);const ok=await commit(s=>{s.drafts[role]=draft});if($('#draft-status'))$('#draft-status').textContent=ok?'● 草稿已儲存於此瀏覽器':'草稿儲存失敗，請重試';if(!ok&&!quiet)toast('草稿未保存');return ok}
function scheduleDraft(){if(edit)return;if($('#draft-status'))$('#draft-status').textContent='正在儲存草稿…';clearTimeout(draftTimer);draftTimer=setTimeout(()=>saveDraft(true),650)}
function uploadField(files,key,imagesOnly=false){return `<div class="upload"><span>${imagesOnly?'加入圖片':'加入圖片或附件'} · 單檔 5 MB</span><input type="file" data-upload="${key}" multiple accept="${imagesOnly?'.png,.jpg,.jpeg,.webp':'.png,.jpg,.jpeg,.webp,.pdf,.csv,.xls,.xlsx'}" aria-label="${imagesOnly?'加入區塊圖片':'加入附件'}"><small>圖片：PNG、JPG、WebP${imagesOnly?'':'；附件：PDF、CSV、Excel'}</small><span data-upload-status="${key}" aria-live="polite"></span></div>${files.map((f,i)=>`<div class="filetag">${f.type.startsWith('image/')?`<img src="${esc(f.data)}" alt="${esc(f.name)}">`:''}<span>${esc(f.name)} · ${size(f.size)}</span><button class="small ghost" type="button" data-removefile="${key}" data-index="${i}">移除</button></div>`).join('')}`}
function renderForm(){if(!formData){if(edit){const r=state.reports.find(r=>r.id===edit);formData={...structuredClone(r),points:r.points.join('\n'),checked:false}}else formData=structuredClone(state.drafts[role]||blank())}const f=formData;$('#page').innerHTML=`<section class="intro"><div><div class="eyebrow">把需求說清楚，讓好想法往前走</div><h1>${edit?'修改提報':'建立一份新提報'}</h1><p>填好重點、附上素材，讓對方一眼看懂。</p></div></section><div class="panel formpanel"><div class="row between"><div class="modebar">${[['normal','一般提報'],['multi','多組圖文']].map(([v,l])=>`<button data-mode="${v}" class="${f.type===v?'active':''}" ${edit?'disabled':''}>${l}</button>`).join('')}</div><small id="draft-status">${edit?'修改內容將保留紀錄':'● 草稿自動保存'}</small></div><form id="report-form"><label class="field"><b>提報標題 *</b><input name="title" required maxlength="100" value="${esc(f.title)}" placeholder="例如：週末活動視覺確認"></label><div class="formgrid"><label class="field"><b>工作重點（每行一項）</b><textarea name="points" maxlength="3000" placeholder="這份提報有哪些重點？">${esc(f.points)}</textarea></label><label class="field"><b>補充說明</b><textarea name="detail" maxlength="5000" placeholder="補充背景、限制或需要知道的資訊…">${esc(f.detail)}</textarea></label></div>${f.type==='normal'?`<label class="field"><b>希望審核者決定什麼？ *</b><input name="question" required maxlength="250" value="${esc(f.question)}" placeholder="例如：這次活動要使用哪個版本？"></label><div class="field"><b>回答選項（至少兩項）*</b>${f.options.map((o,i)=>`<div class="editrow"><input data-opt="${i}" aria-label="回答選項 ${i+1}" maxlength="200" value="${esc(o)}" placeholder="選項 ${String.fromCharCode(65+i)}"><button type="button" class="small ghost" data-delopt="${i}" aria-label="移除選項 ${i+1}">✕</button></div>`).join('')}<button type="button" class="small" id="add-option">＋ 新增選項</button></div>${uploadField(f.files,'general')}`:`<p class="muted">每組至少加入一張圖片與兩個不同的回答選項。</p>${f.groups.map((g,i)=>`<section class="group"><div class="grouphead"><h3>區塊 ${i+1}</h3><button type="button" class="small ghost danger" data-delgroup="${g.id}">移除區塊</button></div><label class="field"><b>區塊名稱 *</b><input data-group-label="${g.id}" required maxlength="100" value="${esc(g.label)}"></label>${uploadField(g.images,g.id,true)}<div class="row between" style="margin-top:15px"><b style="font-size:13px">回答選項</b><button type="button" class="small ghost" data-yesno="${g.id}">改為是／否</button></div>${g.options.map((o,n)=>`<div class="editrow"><input data-group-opt="${g.id}" data-index="${n}" aria-label="區塊 ${i+1} 選項 ${n+1}" maxlength="200" value="${esc(o)}" placeholder="選項 ${String.fromCharCode(65+n)}"><button type="button" class="small ghost" data-delgopt="${g.id}" data-index="${n}" aria-label="移除區塊選項">✕</button></div>`).join('')}<button type="button" class="small" data-addgopt="${g.id}">＋ 新增選項</button></section>`).join('')}<button type="button" id="add-group">＋ 新增圖文區塊</button>`}<label class="checklabel"><input type="checkbox" id="checked" ${f.checked?'checked':''} required>我已確認內容、素材與回答選項正確。</label><p id="form-error" role="alert"></p><div class="actionbar"><button type="button" id="cancel-form">${edit?'取消修改':'返回工作台'}</button><button class="primary" id="submit-report" type="submit">${edit?'儲存修改':'確認送出提報'}</button></div></form></div>`;
$$('[data-mode]').forEach(b=>b.onclick=()=>{f.type=b.dataset.mode;scheduleDraft();renderForm()});$$('[name]',$('#report-form')).forEach(el=>el.oninput=()=>{f[el.name]=el.value;scheduleDraft()});$('#checked').onchange=e=>{f.checked=e.target.checked;scheduleDraft()};$$('[data-opt]').forEach(el=>el.oninput=()=>{f.options[+el.dataset.opt]=el.value;scheduleDraft()});$('#add-option')?.addEventListener('click',()=>{f.options.push('');renderForm();scheduleDraft()});$$('[data-delopt]').forEach(b=>b.onclick=()=>{f.options.splice(+b.dataset.delopt,1);renderForm();scheduleDraft()});$('#add-group')?.addEventListener('click',()=>{f.groups.push({id:uid(),label:'第 '+(f.groups.length+1)+' 組',images:[],options:['','']});renderForm();scheduleDraft()});$$('[data-delgroup]').forEach(b=>b.onclick=()=>{f.groups=f.groups.filter(g=>g.id!==b.dataset.delgroup);renderForm();scheduleDraft()});$$('[data-group-label]').forEach(el=>el.oninput=()=>{f.groups.find(g=>g.id===el.dataset.groupLabel).label=el.value;scheduleDraft()});$$('[data-group-opt]').forEach(el=>el.oninput=()=>{f.groups.find(g=>g.id===el.dataset.groupOpt).options[+el.dataset.index]=el.value;scheduleDraft()});$$('[data-addgopt]').forEach(b=>b.onclick=()=>{f.groups.find(g=>g.id===b.dataset.addgopt).options.push('');renderForm();scheduleDraft()});$$('[data-delgopt]').forEach(b=>b.onclick=()=>{f.groups.find(g=>g.id===b.dataset.delgopt).options.splice(+b.dataset.index,1);renderForm();scheduleDraft()});$$('[data-yesno]').forEach(b=>b.onclick=()=>{f.groups.find(g=>g.id===b.dataset.yesno).options=['是','否'];renderForm();scheduleDraft()});$$('[data-upload]').forEach(el=>el.onchange=async()=>{if(uploadBusy)return;uploadBusy=true;$('#submit-report').disabled=true;const key=el.dataset.upload;const label=$('[data-upload-status="'+key+'"]');label.textContent='正在處理檔案…';try{const added=await readFiles(el.files,key!=='general');checkTotal(added);const target=key==='general'?f.files:f.groups.find(g=>g.id===key).images;let skipped=0;for(const file of added){if(target.some(x=>x.name===file.name&&x.size===file.size))skipped++;else target.push(file)}toast(skipped?'處理完成，已略過 '+skipped+' 個重複檔案':'檔案處理完成');renderForm();scheduleDraft()}catch(e){label.textContent=e.message;label.className='error'}finally{uploadBusy=false;$('#submit-report').disabled=false}});$$('[data-removefile]').forEach(b=>b.onclick=()=>{const list=b.dataset.removefile==='general'?f.files:f.groups.find(g=>g.id===b.dataset.removefile).images;list.splice(+b.dataset.index,1);renderForm();scheduleDraft()});$('#cancel-form').onclick=()=>navigate('inbox');$('#report-form').onsubmit=async e=>{e.preventDefault();if(uploadBusy)return;const opts=f.options.map(o=>o.trim()).filter(Boolean),groups=f.type==='multi'?f.groups.map(g=>({...g,label:g.label.trim(),options:g.options.map(o=>o.trim()).filter(Boolean)})):[];let error='';if(!f.title.trim())error='請填寫標題';else if(f.type==='normal'&&(!f.question.trim()||opts.length<2||new Set(opts).size!==opts.length))error='請填寫問題與至少兩個不同的回答選項';else if(f.type==='multi'&&(!groups.length||groups.some(g=>!g.label||!g.images.length||g.options.length<2||new Set(g.options).size!==g.options.length)))error='每個區塊都需要名稱、圖片，以及至少兩個不同的回答選項';else if(!f.checked)error='請先確認內容';if(error){$('#form-error').textContent=error;$('#form-error').className='error';return}clearTimeout(draftTimer);$('#submit-report').disabled=true;const id=edit||uid();const ok=await commit(s=>{const data={title:f.title.trim(),type:f.type,points:f.points.split('\n').map(x=>x.trim()).filter(Boolean),detail:f.detail,question:f.type==='multi'?'請逐組查看圖片並選擇答案':f.question.trim(),options:f.type==='normal'?opts:[],groups,files:f.type==='normal'?f.files:[]};if(edit){const x=s.reports.find(r=>r.id===edit);x.history.push({at:Date.now(),actor:role,text:'修改提報：'+x.title+' → '+data.title,before:{title:x.title,points:x.points,detail:x.detail,question:x.question,options:x.options},after:{title:data.title,points:data.points,detail:data.detail,question:data.question,options:data.options}});Object.assign(x,data)}else{s.reports.unshift({id,...data,author:role,created:Date.now(),status:'pending',answers:{},shares:[],comments:[],history:[]});delete s.drafts[role]}},edit?'修改已儲存':'提報已送出');if(ok){formData=null;edit=null;selected=id;filter='pending';view='inbox';shell()}else $('#submit-report').disabled=false}}
function renderAdmin(){const boss=me().role==='主管';$('#page').innerHTML=`<section class="intro"><div><div class="eyebrow">讓每個人，在適合的位置協作</div><h1>管理與角色設定</h1><p>示範名單與權限；變更只作用於目前瀏覽器。</p></div></section><div class="panel formpanel"><div class="welcome"><h3>不同角色，一起把事情做好。</h3><p>主管與權限管理員可審核及管理名單；員工可提報、補件與參與獲分享的討論。主管交接僅能由現任主管執行。</p></div>${state.users.map(u=>`<div class="adminitem"><div class="person"><span class="avatar">${esc(u.name.slice(-2))}</span><p>${esc(u.name)}${u.id===role?'（你）':''}<small>${esc(u.role)}</small></p></div><select data-user-role="${u.id}" aria-label="${esc(u.name)}的角色" ${u.role==='主管'||u.id===role?'disabled':''}>${['員工','權限管理員',...(boss?['主管']:[])].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select><button class="small danger" data-deleteuser="${u.id}" ${u.id===role||u.role==='主管'?'disabled':''}>移除</button></div>`).join('')}<h3 style="margin-top:25px">新增示範人員</h3><form id="add-user" class="row"><input id="new-name" aria-label="姓名" placeholder="姓名" required maxlength="20"><select id="new-role" aria-label="新增角色"><option>員工</option><option>權限管理員</option></select><button class="primary">新增</button></form><details style="margin-top:24px"><summary>修改我的顯示名稱</summary><form id="profile" class="row" style="margin-top:12px"><input id="my-name" aria-label="我的顯示名稱" maxlength="20" required value="${esc(me().name)}"><button>儲存名稱</button></form></details></div>`;$('#add-user').onsubmit=async e=>{e.preventDefault();const name=$('#new-name').value.trim(),r=$('#new-role').value;if(!name)return;if(state.users.some(u=>u.name===name))return toast('已有相同姓名，請使用不同名稱');if(await commit(s=>s.users.push({id:uid(),name,role:r}),'人員已新增'))renderAdmin()};$$('[data-user-role]').forEach(el=>el.onchange=async()=>{const id=el.dataset.userRole,r=el.value;if(r==='主管'){const d=showModal(`<h2>交接主管權限</h2><p>將主管交接給 ${esc(uname(id))}，你會轉為權限管理員。</p><button class="primary" id="handover">確認交接</button>`);$('#handover').onclick=async()=>{if(await commit(s=>{s.users.find(u=>u.id===role).role='權限管理員';s.users.find(u=>u.id===id).role='主管'},'主管已交接')){d.close();shell()}}}else if(await commit(s=>s.users.find(u=>u.id===id).role=r,'角色已更新'))shell()});$$('[data-deleteuser]').forEach(b=>b.onclick=()=>{const id=b.dataset.deleteuser;const d=showModal(`<h2>移除此示範人員？</h2><p>${esc(uname(id))} 將從角色名單移除，歷史提報仍會保留。</p><button class="danger" id="delete-user-confirm">確認移除</button>`);$('#delete-user-confirm').onclick=async()=>{if(await commit(s=>{s.users=s.users.filter(u=>u.id!==id);s.reports.forEach(r=>r.shares=r.shares.filter(x=>x.user!==id));delete s.drafts[id]},'人員已移除')){d.close();shell()}}});$('#profile').onsubmit=async e=>{e.preventDefault();const name=$('#my-name').value.trim();if(name&&await commit(s=>s.users.find(u=>u.id===role).name=name,'名稱已更新'))shell()}}
async function startVoice(){if(recording){recording.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('此瀏覽器不支援錄音，請改用文字留言');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(!$('#voice-area')){stream.getTracks().forEach(t=>t.stop());return}const chunks=[],start=Date.now();const type=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));const rec=new MediaRecorder(stream,type?{mimeType:type}:undefined);recording=rec;rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{clearInterval(voiceTimer);stream.getTracks().forEach(t=>t.stop());recording=null;if(rec.discard)return;const blob=new Blob(chunks,{type:rec.mimeType});if(!blob.size||blob.size>5*1024*1024)return toast('錄音是空白或超過大小限制，請重新錄製');const reader=new FileReader();reader.onload=()=>{voice={data:reader.result,seconds:Math.max(1,Math.round((Date.now()-start)/1000))};const area=$('#voice-area');if(!area)return;area.innerHTML=`<audio controls src="${esc(voice.data)}"></audio><div class="row"><button class="small primary" id="send-voice">送出錄音</button><button class="small" id="discard-voice">捨棄錄音</button></div>`;$('#voice').textContent='♩ 重新錄製';$('#discard-voice').onclick=()=>{voice=null;area.innerHTML=''};$('#send-voice').onclick=sendVoice};reader.readAsDataURL(blob)};rec.onerror=()=>{rec.discard=true;stopVoice();toast('錄音失敗，請重試或使用文字留言')};rec.start();$('#voice').textContent='■ 停止錄音';voiceTimer=setInterval(()=>{const secs=Math.floor((Date.now()-start)/1000);if($('#voice-area'))$('#voice-area').textContent='正在錄音 '+secs+' 秒（最長 60 秒）';if(secs>=60&&rec.state==='recording')rec.stop()},500)}catch(e){toast('無法使用麥克風，請允許權限或改用文字留言')}}
function stopVoice(){if(recording){recording.discard=true;if(recording.state==='recording')recording.stop();recording.stream.getTracks().forEach(t=>t.stop());recording=null}clearInterval(voiceTimer);voice=null}
async function sendVoice(){const r=current();if(!voice||!r||!commentable(r))return;const v=voice;try{checkTotal(v)}catch(e){return toast(e.message)}if(await commit(s=>s.reports.find(x=>x.id===r.id).comments.push({id:uid(),author:role,body:'語音留言（'+v.seconds+' 秒）',audio:v.data,at:Date.now(),history:[]}),'錄音留言已送出')){voice=null;renderDetail()}}
function help(){showModal(`<h2>歡迎來到工作提報小站 ♧</h2><p class="muted">這是一個可實際操作的課程作業網站。所有人物、圖片及工作內容皆為示範資料。</p><div class="question"><strong>建議體驗順序</strong><ol><li>使用「林予安 · 主管」，開啟三組圖文，選擇答案並確認送出。</li><li>切換「陳小禾 · 員工」，查看結果、留言或補件。</li><li>建立一份自己的提報，再切換回主管審核。</li></ol></div><p>所有變更僅保存在目前瀏覽器，不會跨裝置同步。清除網站資料會移除這裡的內容。</p><p>附件單檔上限 5 MB，語音最長 60 秒。角色切換只示範操作差異，並非正式登入或安全隔離。</p><p>如需重新體驗，可按右上方「重設示範」。</p>`)}
function reset(){const d=showModal('<h2>重新開始示範？</h2><p>將清除這個瀏覽器內新增的提報、留言、附件與草稿，恢復初始示範內容。</p><div class="row"><button class="danger" id="reset-confirm">清除並重設</button><button id="reset-cancel">取消</button></div>');$('#reset-cancel').onclick=()=>d.close();$('#reset-confirm').onclick=async()=>{clearTimeout(draftTimer);if(await commit(s=>{const fresh=seed();Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,fresh)},'已恢復示範資料')){role='lead';view='inbox';filter='pending';query='';selected='sample-multi';decisionDraft={};formData=null;edit=null;d.close();shell()}}}
$('#modal').addEventListener('cancel',()=>{stopVoice()});window.addEventListener('pagehide',()=>stopVoice());
(async()=>{try{db=await openDB();state=await dbGet();if(!state){state=seed();await dbPut(state)}document.body.classList.remove('loading');shell()}catch(e){document.body.classList.remove('loading');$('#app').innerHTML='<main style="max-width:650px;margin:15vh auto;padding:25px"><h1>暫時無法開啟儲存空間</h1><p>此網站需要瀏覽器的本機儲存功能。請允許網站儲存資料，或改用一般瀏覽模式後重新整理。</p><button onclick="location.reload()">重新整理</button></main>'}})();
</script>
